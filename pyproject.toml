[project]
name = "heights-film-paper"
version = "0.1.0"
description = "Analysis for the heights film continuous-rating validation study (OSF preregistration osf.io/s2yvb)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "pypdf>=6.19.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
